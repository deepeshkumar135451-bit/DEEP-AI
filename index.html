<script>
(function () {
    if (document.getElementById("stopVoiceBtn")) return;

    const button = document.createElement("button");
    button.id = "stopVoiceBtn";
    button.className = "voice-control-btn";
    button.textContent = "⏹ Stop Voice";
    button.type = "button";
    button.style.position = "fixed";
    button.style.bottom = "90px";
    button.style.right = "20px";
    button.style.zIndex = "9999";

    button.addEventListener("click", function () {
        window.speechSynthesis.cancel();
        button.classList.remove("voice-speaking");
    });

    document.body.appendChild(button);

    window.addEventListener("beforeunload", function () {
        window.speechSynthesis.cancel();
    });
})();
</script>

                    try {

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
window.auth = auth;
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

let isSignup = false;

function showMessage(message) {
  const el = document.getElementById("authMessage");
  if (el) el.textContent = message;
}

window.openAuthModal = function () {
  document.getElementById("authModal").hidden = false;
  showMessage("");
};

window.closeAuthModal = function () {
  document.getElementById("authModal").hidden = true;
};

window.toggleAuthMode = function () {
  isSignup = !isSignup;
  document.getElementById("authTitle").textContent =
    isSignup ? "Create your Deep AI account" : "Welcome to Deep AI";
  document.getElementById("authName").hidden = !isSignup;
  document.getElementById("authName").required = isSignup;
  document.getElementById("authPassword").autocomplete =
    isSignup ? "new-password" : "current-password";
  document.getElementById("emailSubmitBtn").textContent =
    isSignup ? "Create Account" : "Login";
  document.getElementById("authModeBtn").textContent =
    isSignup ? "Already have an account? Login" : "Create an account";
  document.getElementById("forgotPasswordBtn").hidden = isSignup;
  showMessage("");
};

document.getElementById("authForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const name = document.getElementById("authName").value.trim();

  try {
    if (isSignup) {
      const result = await createUserWithEmailAndPassword(auth, email, password);
      if (name) await updateProfile(result.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }

    closeAuthModal();
    showMessage("");
  } catch (error) {
    showMessage(error.message);
  }
});

window.googleLogin = async function () {
  try {
    await signInWithPopup(auth, googleProvider);
    closeAuthModal();
  } catch (error) {
    showMessage(error.message);
  }
};

window.resetPassword = async function () {
  const email = document.getElementById("authEmail").value.trim();

  if (!email) {
    showMessage("Pehle apna email address enter karo.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email bhej diya gaya hai. Inbox check karo.");
  } catch (error) {
    showMessage(error.message);
  }
};

window.showProfile = function () {
  const user = window.auth?.currentUser;
  if (!user) return;

  document.getElementById("profileDetails").textContent =
    `Name: ${user.displayName || "Not set"} | Email: ${user.email || "Not available"}`;

  document.getElementById("profileModal").hidden = false;
};

window.closeProfile = function () {
  document.getElementById("profileModal").hidden = true;
};

window.logoutUser = async function () {
  try {
    await signOut(auth);
  } catch (error) {
    alert(error.message);
  }
};
// Save a chat to the logged-in user's Firestore account
async function saveChatToFirebase(userId, message, reply) {
  try {
    await addDoc(collection(db, "users", userId, "chats"), {
      message: message,
      reply: reply,
      createdAt: serverTimestamp()
    });
    console.log("Chat saved to Firebase");
  } catch (error) {
    console.error("Firebase chat save error:", error);
  }
}
onAuthStateChanged(auth, (user) => {
  document.getElementById("accountStatus").textContent =
    user ? `Hi, ${user.displayName || user.email}` : "Guest mode";

  document.getElementById("loginOpenBtn").hidden = !!user;
  document.getElementById("profileBtn").hidden = !user;
  document.getElementById("logoutBtn").hidden = !user;
});
</script>
